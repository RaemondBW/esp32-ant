; BLE <-> ANT+ handoff on one ESP32-S3 radio, Arduino framework, NimBLE-Arduino
; linked in alongside the ANT stack. This is the shape of the bike-computer
; integration: NimBLE owns the BLE core until the app switches to ANT+ sensors,
; then NimBLEDevice::deinit(true) hands the controller to ant_node_start(), and
; ant_node_stop() hands it back.
;
;   ~/.platformio/penv/bin/pio run
[env:esp32s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.3
    symlink://../../components/ant

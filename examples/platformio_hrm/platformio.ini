; ANT+ heart-rate display on a bare ESP32-S3, Arduino framework, no external
; radio. Same platform/framework pins as the tdisplay bike computer so what
; builds here builds there.
;
;   ~/.platformio/penv/bin/pio run                 # compile
;   ~/.platformio/penv/bin/pio run -t upload -t monitor
[env:esp32s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    symlink://../../components/ant
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Sensor role: broadcast a fake heart rate to a real ANT+ display.
[env:esp32s3-sensor]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DANT_EXAMPLE_SENSOR

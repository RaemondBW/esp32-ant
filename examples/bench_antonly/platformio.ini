; BLE and ANT+ at the same time on one ESP32-S3 radio, Arduino framework.
;
; Unlike platformio_ble_handoff (which time-shares the radio, only one protocol
; alive at a time), this keeps NimBLE up the whole time and lets ANT+ ride the
; BLE controller's passive-scan windows. NimBLE stays connected/scannable; the
; ANT stack receives the heart-rate strap on the same radio.
;
;   ~/.platformio/penv/bin/pio run
;   ~/.platformio/penv/bin/pio run -t upload -t monitor
[env:esp32s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.3
    symlink://../../components/ant
